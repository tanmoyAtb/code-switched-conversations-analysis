[project]
name = "code-switched-conversations-training"
version = "0.1.0"
description = "Reproducible training and evaluation for Bangla-English language identification."
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.0,<3",
    "scikit-learn>=1.5,<2",
    "torch>=2.6,<3",
    "transformers>=4.50,<6",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_switching_training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
